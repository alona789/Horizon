name: Daily Horizon Summary

on:
  schedule:
    # GitHub scheduled workflows use UTC. 20:00 UTC is 04:00 Asia/Shanghai;
    # this intentionally runs early to offset the observed schedule delay.
    - cron: '0 23 * * *'
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Validate AI endpoint variables
        env:
          HORIZON_AI_PROVIDER: ${{ vars.HORIZON_AI_PROVIDER }}
          HORIZON_AI_BASE_URL: ${{ vars.HORIZON_AI_BASE_URL }}
          HORIZON_AI_MODEL: ${{ vars.HORIZON_AI_MODEL }}
          HORIZON_AI_KEY: ${{ secrets.HORIZON_AI_KEY }}
        run: |
          missing=""
          [ -z "$HORIZON_AI_PROVIDER" ] && missing="$missing HORIZON_AI_PROVIDER"
          [ -z "$HORIZON_AI_BASE_URL" ] && missing="$missing HORIZON_AI_BASE_URL"
          [ -z "$HORIZON_AI_MODEL" ] && missing="$missing HORIZON_AI_MODEL"
          # Ollama accepts unauthenticated requests; every other provider needs a key.
          if [ "$HORIZON_AI_PROVIDER" != "ollama" ] && [ -z "$HORIZON_AI_KEY" ]; then
            missing="$missing HORIZON_AI_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions configuration:$missing"
            echo "Set Variables (HORIZON_AI_PROVIDER / HORIZON_AI_BASE_URL / HORIZON_AI_MODEL)"
            echo "and the Secret HORIZON_AI_KEY in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run Horizon
        env:
          # The AI endpoint is fully driven by repository configuration:
          #   vars.HORIZON_AI_PROVIDER  -> anthropic | openai | deepseek | ollama | ...
          #   vars.HORIZON_AI_BASE_URL  -> any OpenAI-/Anthropic-compatible URL
          #   vars.HORIZON_AI_MODEL     -> model name understood by that endpoint
          #   secrets.HORIZON_AI_KEY    -> API key for that endpoint
          HORIZON_AI_PROVIDER: ${{ vars.HORIZON_AI_PROVIDER }}
          HORIZON_AI_BASE_URL: ${{ vars.HORIZON_AI_BASE_URL }}
          HORIZON_AI_MODEL: ${{ vars.HORIZON_AI_MODEL }}
          HORIZON_AI_KEY: ${{ secrets.HORIZON_AI_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
